<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة متجر الجوكر</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#eef8ff;font-family:Cairo,sans-serif;color:#09213f}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:18px}.top{background:linear-gradient(135deg,#00152f,#0d47a1);color:#fff;border-radius:18px;padding:18px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}.panel{background:#fff;border:1px solid #b7dcfa;border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 5px 20px #0d47a10d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.field{margin-bottom:10px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #9cccf2;border-radius:10px;outline:none}.field textarea{min-height:70px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800}.primary{background:#0d47a1;color:#fff}.green{background:#16a34a;color:#fff}.danger{background:#dc2626;color:#fff}.muted{color:#607d9b;font-size:12px}.hidden{display:none!important}.login{max-width:420px;margin:12vh auto}.product{border:1px solid #c8e2f5;border-radius:14px;padding:12px}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:8px 0}.thumbs img{width:100%;height:65px;object-fit:cover;border-radius:7px;background:#eef8ff}.status{padding:4px 8px;border-radius:20px;background:#e0f2fe;font-size:11px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#08254a;color:#fff;padding:11px 18px;border-radius:10px;display:none}
</style></head><body><div id="login" class="wrap login"><div class="panel"><h2>لوحة تحكم الجوكر</h2><p class="muted">هذه الصفحة مخفية عن الزوار.</p><div class="field"><label>اسم المستخدم</label><input id="u" value="admin" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="p" type="password" value="admin" autocomplete="current-password"></div><button class="btn primary" style="width:100%" onclick="login()">دخول</button></div></div>
<div id="app" class="wrap hidden"><div class="top"><div><b>إدارة متجر الجوكر</b><div class="muted" style="color:#b9ddff">إدارة الإعلانات والصور والأسعار</div></div><button class="btn" onclick="logout()" style="background:#fff;color:#0d47a1">خروج</button></div>
<div class="panel"><div class="actions"><button class="btn primary" onclick="newProduct()">+ إضافة إعلان</button><button class="btn green" onclick="load()">تحديث البيانات</button></div></div>
<div id="products" class="grid"></div>
<div class="panel"><h3>بيانات المتجر</h3><div class="grid"><div class="field"><label>اسم الموقع</label><input id="site_title"></div><div class="field"><label>العنوان الفرعي</label><input id="site_subtitle"></div><div class="field"><label>واتساب</label><input id="whatsapp_number"></div><div class="field"><label>رابط فودافون كاش</label><input id="vodafone_link"></div><div class="field"><label>رابط إنستا باي</label><input id="instapay_link"></div><div class="field"><label>صورة الهيدر URL</label><input id="header_image_url"></div><div class="field" style="grid-column:1/-1"><label>نص الفوتر</label><textarea id="footer_text"></textarea></div></div><button class="btn primary" onclick="saveSettings()">حفظ بيانات المتجر</button></div>
<div class="panel"><h3>تغيير بيانات الدخول</h3><div class="field"><label>اسم المستخدم</label><input id="newuser" value="admin"></div><div class="field"><label>كلمة المرور الجديدة</label><input id="newpass" type="password" placeholder="اتركها كما هي إذا لم ترد التغيير"></div><button class="btn primary" onclick="changePassword()">حفظ كلمة المرور</button></div></div><div id="toast" class="toast"></div>
<script>
const API='https://nziqmfqcrrndzbasyeps.supabase.co/functions/v1/store-admin';let token=localStorage.getItem('joker_admin_token');let state={products:[],settings:{}};
const $=id=>document.getElementById(id);
function msg(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(API+path,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'حدث خطأ');return d}
async function login(){try{const d=await api('/login',{method:'POST',body:JSON.stringify({username:$('u').value,password:$('p').value})});token=d.token;localStorage.setItem('joker_admin_token',token);$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){alert(e.message)}}
function logout(){localStorage.removeItem('joker_admin_token');location.reload()}
async function load(){try{state=await api('');$('login').classList.add('hidden');$('app').classList.remove('hidden');render();fillSettings()}catch(e){logout()}}
function render(){const box=$('products');box.innerHTML='';state.products.forEach(p=>{const el=document.createElement('div');el.className='product';el.innerHTML='<div class="actions" style="justify-content:space-between"><b>#'+p.id+'</b><span class="status">'+(p.active?'ظاهر':'مخفي')+'</span></div><div class="thumbs">'+(p.images||[]).map(x=>'<img src="'+x+'">').join('')+'</div><div class="field"><label>اسم الإعلان</label><input data-k="name" value="'+esc(p.name)+'"></div><div class="field"><label>السعر</label><input data-k="price" type="number" value="'+p.price+'"></div><div class="field"><label>القسم</label><select data-k="type"><option value="mobile" '+(p.type==='mobile'?'selected':'')+'>آيفون</option><option value="acc" '+(p.type==='acc'?'selected':'')+'>إكسسوارات</option></select></div><div class="field"><label>صور الإعلان</label><input type="file" accept="image/*" multiple onchange="uploadFiles(this,'+p.id+')"><div class="muted" style="margin-top:5px">اختر الصور من الجهاز مباشرة</div></div><div class="actions"><button class="btn primary" onclick="saveProduct('+p.id+',this)">حفظ</button><button class="btn" onclick="toggleProduct('+p.id+','+(!p.active)+')" style="background:#e0f2fe">'+(p.active?'إخفاء':'إظهار')+'</button><button class="btn danger" onclick="delProduct('+p.id+')">حذف</button></div>';box.appendChild(el)})}
function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function cardValues(btn){const c=btn.closest('.product');const id=Number(c.querySelector('.actions b').textContent.replace('#',''));const p=state.products.find(x=>x.id===id);return {name:c.querySelector('[data-k=name]').value,price:Number(c.querySelector('[data-k=price]').value)||0,type:c.querySelector('[data-k=type]').value,images:p?.images||[]}}
async function saveProduct(id,btn){try{const p=state.products.find(x=>x.id===id);Object.assign(p,cardValues(btn));await api('/product',{method:'PUT',body:JSON.stringify({product:p})});msg('تم حفظ الإعلان')}catch(e){alert(e.message)}}
async function toggleProduct(id,active){const p=state.products.find(x=>x.id===id);p.active=active;await api('/product',{method:'PUT',body:JSON.stringify({product:p})});await load()}
async function delProduct(id){if(!confirm('حذف الإعلان نهائيا؟'))return;await api('/product',{method:'DELETE',body:JSON.stringify({id})});await load()}
function newProduct(){const id=state.products.length?Math.max(...state.products.map(x=>x.id))+1:1;state.products.push({id,name:'إعلان جديد',price:0,type:'acc',images:[],active:true,sort_order:id});render()}
async function uploadFiles(input,id){const files=[...input.files];if(!files.length)return;const p=state.products.find(x=>x.id===id);if(!p)return;try{msg('جاري رفع الصور...');for(const f of files){const rd=new FileReader();const dataUrl=await new Promise((resolve,reject)=>{rd.onload=()=>resolve(rd.result);rd.onerror=reject;rd.readAsDataURL(f)});const d=await api('/upload',{method:'POST',body:JSON.stringify({dataUrl,ext:(f.name.split('.').pop()||'jpg')})});if(d.url)p.images=[...(p.images||[]),d.url]}await api('/product',{method:'PUT',body:JSON.stringify({product:p})});input.value='';render();msg('تم رفع الصور وحفظ الإعلان')}catch(e){alert(e.message)}}
function fillSettings(){const s=state.settings||{};['site_title','site_subtitle','whatsapp_number','vodafone_link','instapay_link','header_image_url','footer_text'].forEach(k=>$(k).value=s[k]||'')}
async function saveSettings(){const s={};['site_title','site_subtitle','whatsapp_number','vodafone_link','instapay_link','header_image_url','footer_text'].forEach(k=>s[k]=$(k).value);await api('/settings',{method:'PUT',body:JSON.stringify({settings:s})});msg('تم حفظ البيانات')}
async function changePassword(){const pass=$('newpass').value;if(!pass){msg('اكتب كلمة المرور الجديدة');return}await api('/password',{method:'PUT',body:JSON.stringify({password:pass})});$('newpass').value='';msg('تم تغيير كلمة المرور')}
if(token){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}
</script></body></html>
